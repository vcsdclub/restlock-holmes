name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install integrity-pinned Node
        run: |
          node scripts/install-secure-node.mjs "$RUNNER_TEMP/restlock-node"
          echo "$RUNNER_TEMP/restlock-node/bin" >> "$GITHUB_PATH"

      - name: Install verified Bun
        run: node scripts/install-secure-bun.mjs .tools/bun

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check types
        run: npm run check

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test
