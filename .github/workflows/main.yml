name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Bun 1.4.4 is the first stable release that distrusts the compromised eMudhra roots.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check types
        run: npm run check

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test
